# Global tool versions for mise (linked to ~/.config/mise/config.toml).
# `u` runs `mise upgrade`; projects pin their own versions in mise.toml.

[tools]
node = "lts"
pnpm = "latest"
"npm:@github/copilot" = "latest"
# mermaid-cli (mmdc) stays on Volta for now: mise refuses chromium-bidi@157.0.8090-0, which puppeteer-core
# depends on, because it lacks the provenance earlier releases had. Add it back once that is resolved.
# "npm:@mermaid-js/mermaid-cli" = "latest"
