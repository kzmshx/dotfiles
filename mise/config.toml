# Global tool versions for mise (linked to ~/.config/mise/config.toml).
# `u` runs `mise upgrade`; projects pin their own versions in mise.toml.

[tools]
node = "lts"
pnpm = "latest"
"npm:@github/copilot" = "latest"
# mermaid-cli (mmdc, used by the md-to-docx / md-to-confluence skills). mise's trust policy refuses
# chromium-bidi@157.0.8090-0 (pulled in by puppeteer-core) because it has no provenance while earlier
# releases did. Published by chrome-devtools-npm like the rest; excluded after review on 2026-11-15.
"npm:@mermaid-js/mermaid-cli" = { version = "latest", trust_policy_excludes = ["chromium-bidi@157.0.8090-0"] }
